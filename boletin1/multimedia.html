<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5 - ráctica Guiada de Elementos Embebidos y Contenido Multimedia
    </title>
</head>


<body>
    <!--Sección 1: Marcos e Integración Externa (<iframe>, <embed> y <object>)-->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/mNbnV3aN3KA?si=4Xu0xWQaP_6gEyXk"
        title="Video tutorial  de HTML5" frameborder="0" loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
    </iframe>

    <embed src=../Media/apuntes.pdf type="application/pdf" width="100%" height="500px"></embed>

    <object data="https://www.wikipedia.org" type="text/html">Tu navegador no admite la visualización de este objeto
        incrustado</object>

    <!--Sección 2: Reproductores Multimedia Nativos (<video>, <audio> y <source>)-->

    <video controls width="640" poster="../Media/portada.jpg">
        <source src="../Media/muestra.mp4" type="video/mp4">
        <source src="../Media/muestra.webm" type="video/webm">
        Tu navegador no soporta la reproducción de vídeo.
    </video>

    <audio controls source src="../media/pista.mp3" type="audio/mpeg"> </audio>

    <!--Sección 3: Gráficos Vectoriales y Mapa de Bits-->
 
  <h2>Gráfico vectorial</h2>
  <svg width="200" height="200">

    <rect width="200" height="200" fill="blue" />
    
    <circle cx="100" cy="100" r="60" fill="yellow" stroke="red" stroke-width="5" />
  </svg>

  
  <h2>Mapa de bits</h2>
  <canvas id="miLienzo" width="300" height="150">
    Tu navegador no soporta el elemento Canvas
  </canvas>

  <script>
    const canvas = document.getElementById('miLienzo');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'green';
    ctx.fillRect(10, 10, 150, 80);
    ctx.moveTo(0, 0);
    ctx.lineTo(200, 100);
    ctx.stroke();
  </script>




</body>














</html>
