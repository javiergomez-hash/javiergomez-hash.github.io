<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Login</title>
</head>
<body>

  <h1>Iniciar Sesión</h1>

  <form action="https://lm.ciclo.iesnervion.es/login.php" method="POST">

    <p>
      <label for="usuario">Nombre de usuario o Email:</label><br>
      <input type="text" id="usuario" name="usuario" placeholder="usuario@dominio.com" required>
    </p>

    <p>
      <label for="password">Contraseña:</label><br>
      <input type="password" id="password" name="password" required>
    </p>

    <p>
      <input type="checkbox" id="recordar" name="recordar">
      <label for="recordar">Recordar sesión</label>
    </p>

    <button type="submit">Iniciar Sesión</button>

  </form>

</body>
</html>
